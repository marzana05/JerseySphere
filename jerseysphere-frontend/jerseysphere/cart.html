<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your cart — Jersey Universe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: { extend: {
      colors: { night:'#0E1A14', surface:'#16241C', surface2:'#1E2F25', gold:'#D9A441', pitch:'#4CAF6D', retro:'#C0463A', ecru:'#F3EFE3', muted:'#9CA89E', line:'#2A3B30' },
      fontFamily: { display:['Anton','sans-serif'], mono:['Space Mono','monospace'] },
    }}
  };
</script>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="cart" class="bg-night">

<div id="site-header"></div>

<main class="max-w-5xl mx-auto px-4 sm:px-6 py-8">
  <h1 class="font-display text-3xl sm:text-4xl text-ecru mb-8">Your cart</h1>
  <div class="grid lg:grid-cols-[1fr_320px] gap-8">
    <div id="cart-lines" class="space-y-4"></div>
    <aside class="bg-surface border border-line rounded-2xl p-5 h-fit lg:sticky lg:top-24">
      <p class="font-mono text-xs uppercase text-gold mb-4">Order summary</p>
      <div class="space-y-2 text-sm">
        <div class="flex justify-between text-muted"><span>Subtotal</span><span id="sum-subtotal" class="text-ecru font-mono"></span></div>
        <div class="flex justify-between text-muted"><span>Estimated shipping</span><span id="sum-shipping" class="text-ecru font-mono"></span></div>
        <div class="flex justify-between pt-2 border-t border-line text-ecru font-medium"><span>Total</span><span id="sum-total" class="font-mono"></span></div>
      </div>
      <a id="checkout-link" href="checkout.html" class="block text-center mt-5 bg-gold text-[#16130A] font-mono text-sm uppercase tracking-wide px-6 py-3 rounded-full hover:opacity-90">Proceed to checkout</a>
    </aside>
  </div>
</main>

<div id="site-footer"></div>

<script src="js/data.js"></script>
<script src="js/storage.js"></script>
<script src="js/jersey.js"></script>
<script src="js/components.js"></script>
<script src="js/main.js"></script>
<script src="js/cart.js"></script>
</body>
</html>
